[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa-gwb-inference"
version = "1.0"
description = "Train a LISA spectral separator and an SBI posterior estimator"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy", "torch", "sbi>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
